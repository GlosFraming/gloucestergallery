<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Edit your page — Gloucester Gallery</title>
<style>
  :root{--bg:#f6f5f1;--panel:#fff;--ink:#1a1a1a;--muted:#6b6b6b;--line:#e3e1da;--accent:#7a5c3e;--ok:#2e7d4f;--warn:#b23b3b;--soft:#f0eee8}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45}
  header{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  header h1{font-size:16px;margin:0;font-weight:700}
  header .who{font-size:13px;color:var(--muted)}
  header .spacer{flex:1}
  .status{font-size:12px;color:var(--muted)}
  .status b{color:var(--ok)}
  .btn{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--soft);color:var(--ink);padding:8px 13px;border-radius:9px;cursor:pointer}
  .btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  .btn.primary:hover{background:#66492f}
  main{max-width:760px;margin:0 auto;padding:16px}
  .intro{font-size:13.5px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
  .card h2{font-size:14px;margin:0 0 12px;text-transform:uppercase;letter-spacing:.5px;color:var(--accent)}
  label.field{display:block;margin:10px 0}
  label.field>span{display:block;font-size:12px;font-weight:600;color:#444;margin-bottom:4px}
  label.field .hint{font-weight:400;color:var(--muted)}
  input[type=text],input[type=number],textarea,select{width:100%;font:inherit;font-size:14px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
  textarea{resize:vertical;min-height:80px}
  .row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:120px}
  .chk{display:flex;align-items:center;gap:8px;font-size:14px;margin:8px 0}.chk input{width:18px;height:18px}
  .work{border:1px dashed var(--line);border-radius:10px;padding:12px;margin:10px 0;background:#fbfaf7}
  .imgpick{display:flex;gap:12px;align-items:center;margin:6px 0}
  .imgpick .prev{width:74px;height:74px;border-radius:8px;object-fit:cover;background:#eee;border:1px solid var(--line);flex:none}
  .imgpick .drop{flex:1;border:2px dashed var(--line);border-radius:8px;padding:10px;text-align:center;font-size:12px;color:var(--muted);cursor:pointer;background:#fff}
  .imgpick .drop.over{border-color:var(--accent);background:#faf6f0}.imgpick .drop.new{border-color:var(--ok)}
  .del{background:#fff;border:1px solid #e5c9c9;color:var(--warn);font-size:12px;padding:5px 9px;border-radius:7px;cursor:pointer}
  .add{background:#fff;border:1px dashed var(--accent);color:var(--accent);font-size:13px;padding:10px 12px;border-radius:9px;cursor:pointer;width:100%}
  .flex{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.flex.end{justify-content:flex-end}
  .gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:20px;text-align:center}
  .gatecard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:28px 24px;max-width:380px}
  .gatecard h2{margin:6px 0 8px}
  .gatecard p{color:var(--muted);font-size:14px}
  .hide{display:none!important}
  .savebar{position:sticky;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:12px 16px;display:flex;gap:10px;align-items:center;justify-content:flex-end}
</style>
</head>
<body>
<div id="gate" class="gate">
  <div class="gatecard">
    <div style="font-size:30px">🎨</div>
    <h2 id="gate-title">Opening your page…</h2>
    <p id="gate-msg">One moment.</p>
  </div>
</div>

<div id="app" class="hide">
  <header>
    <h1>🎨 Your page</h1>
    <span class="who" id="who"></span>
    <span class="spacer"></span>
    <span id="status" class="status"></span>
    <button class="btn primary" id="btnSaveTop">💾 Save</button>
  </header>
  <main id="main"></main>
  <div class="savebar">
    <span id="status2" class="status"></span>
    <button class="btn primary" id="btnSaveBottom">💾 Save my page</button>
  </div>
</div>

<script>
const DISCIPLINES=["Oil painting","Oil on Canvas","Watercolour","Acrylic","Photography","Printmaking","Sculpture / 3D","Ceramics","Mixed media","Illustration","Drawing / Pastel","Digital art","Other"];
let ART=null;            // the artist object being edited
let newImages={};        // temp path -> dataURL
let saving=false;

function el(tag,attrs,kids){const e=document.createElement(tag);if(attrs)for(const k in attrs){if(k==="class")e.className=attrs[k];else if(k==="html")e.innerHTML=attrs[k];else if(k.startsWith("on")&&typeof attrs[k]==="function")e.addEventListener(k.slice(2),attrs[k]);else e.setAttribute(k,attrs[k]);}(kids||[]).forEach(c=>{if(c==null)return;e.appendChild(typeof c==="string"?document.createTextNode(c):c);});return e;}
function slug(s){return(s||"").toString().toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,32)||"work";}
function rand(){return Math.random().toString(36).slice(2,6);}
function setStatus(m,g){const a=document.getElementById("status"),b=document.getElementById("status2");[a,b].forEach(s=>{if(s)s.innerHTML=g?"<b>"+m+"</b>":m;});}
function imgURL(p){if(!p)return"";if(newImages[p])return newImages[p];if(/^data:/.test(p))return p;return"/"+p.replace(/^\//,"");}

/* image resize */
function processImage(file,mode){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=e=>{const img=new Image();img.onload=()=>{const c=document.createElement("canvas"),ctx=c.getContext("2d");if(mode==="portrait"){const S=1000;c.width=S;c.height=S;const sc=Math.max(S/img.width,S/img.height),cw=S/sc,ch=S/sc;ctx.drawImage(img,(img.width-cw)/2,(img.height-ch)/2,cw,ch,0,0,S,S);}else{const M=1600,sc=Math.min(1,M/Math.max(img.width,img.height));c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);ctx.drawImage(img,0,0,c.width,c.height);}res(c.toDataURL("image/jpeg",0.85));};img.onerror=()=>rej();img.src=e.target.result;};fr.onerror=()=>rej();fr.readAsDataURL(file);});}
async function assignImage(file,mode,target,field,base){if(!/^image\//.test(file.type)){alert("Please choose an image (jpg or png).");return false;}try{const d=await processImage(file,mode);const prev=target[field];if(prev&&newImages[prev])delete newImages[prev];const path="images/"+base+"-"+rand()+".jpg";newImages[path]=d;target[field]=path;return true;}catch(e){alert("Sorry, that image couldn't be read. Try another.");return false;}}

/* field builders */
function field(label,obj,key,opts){opts=opts||{};const w=el("label",{class:"field"});const s=el("span",{},[label]);if(opts.hint)s.appendChild(el("span",{class:"hint"},[" — "+opts.hint]));w.appendChild(s);let inp;if(opts.area)inp=el("textarea",{rows:opts.rows||4});else if(opts.select){inp=el("select");opts.select.forEach(o=>inp.appendChild(el("option",{value:o},[o])));}else inp=el("input",{type:opts.type||"text"});inp.value=obj[key]==null?"":obj[key];inp.addEventListener("input",()=>{obj[key]=opts.type==="number"?(inp.value===""?0:Number(inp.value)):inp.value;});w.appendChild(inp);return w;}
function checkbox(label,obj,key){const w=el("label",{class:"chk"});const i=el("input",{type:"checkbox"});i.checked=!!obj[key];i.addEventListener("change",()=>obj[key]=i.checked);w.appendChild(i);w.appendChild(el("span",{},[label]));return w;}
function imagePicker(target,field,mode,base){const box=el("div",{class:"imgpick"});const prev=el("img",{class:"prev",alt:""});const u=imgURL(target[field]);if(u)prev.src=u;const isNew=target[field]&&newImages[target[field]];const drop=el("div",{class:"drop"+(isNew?" new":"")},[isNew?"✓ New image ready":(target[field]?"Current image — click/drag to replace":"Click or drag a photo here")]);const inp=el("input",{type:"file",accept:"image/*",class:"hide"});const go=async f=>{if(await assignImage(f,mode,target,field,base))render();};drop.addEventListener("click",()=>inp.click());inp.addEventListener("change",()=>{if(inp.files[0])go(inp.files[0]);});drop.addEventListener("dragover",e=>{e.preventDefault();drop.classList.add("over");});drop.addEventListener("dragleave",()=>drop.classList.remove("over"));drop.addEventListener("drop",e=>{e.preventDefault();drop.classList.remove("over");if(e.dataTransfer.files[0])go(e.dataTransfer.files[0]);});box.appendChild(prev);box.appendChild(drop);box.appendChild(inp);return box;}

/* render */
function render(){
  const m=document.getElementById("main");m.innerHTML="";
  const a=ART;
  document.getElementById("who").textContent=a.name?("— "+a.name):"";
  m.appendChild(el("div",{class:"intro"},["This is your own page on the Gloucester Gallery website. Edit anything here, add or remove works, then press ",el("b",{},["Save my page"]),". Your changes go live straight away. You can come back and change it as often as you like."]));
  m.appendChild(el("div",{class:"card"},[
    el("h2",{},["About you"]),
    el("div",{class:"row"},[field("Your name",a,"name"),field("Your medium",a,"discipline",{select:DISCIPLINES})]),
    field("Tagline",a,"tagline",{hint:"one short line about your work"}),
    field("About you / statement",a,"bio",{area:true,rows:5}),
    el("label",{class:"field"},[el("span",{},["Your portrait photo ",el("span",{class:"hint"},["— square works best"])])]),
    imagePicker(a,"portrait","portrait","artist-"+slug(a.id||a.name)),
    el("div",{class:"row"},[field("Launch date",a,"launchDate",{hint:"optional"}),field("Launch note",a,"launchNote",{hint:"optional"})])
  ]));
  const works=el("div",{},[
    ...a.works.map((w,i)=>el("div",{class:"work"},[
      el("div",{class:"row"},[field("Title",w,"title"),field("Price £",w,"price",{type:"number"})]),
      el("div",{class:"row"},[field("Medium",w,"medium",{hint:"e.g. Oil on canvas"}),field("Size",w,"size",{hint:"e.g. 42 × 59 cm"})]),
      imagePicker(w,"src","work",slug(a.id||a.name)+"-"+slug(w.title||("work"+(i+1)))),
      el("div",{class:"flex",style:"justify-content:space-between;margin-top:6px"},[
        checkbox("Available to buy",w,"available"),
        el("button",{class:"del",onclick:()=>{a.works.splice(i,1);render();}},["Remove work"])
      ])
    ])),
    el("button",{class:"add",onclick:()=>{a.works.push({title:"",medium:"",size:"",price:0,available:true,src:""});render();}},["+ Add a work"])
  ]);
  m.appendChild(el("div",{class:"card"},[el("h2",{},["Your works"]),works]));
}

/* save */
async function uploadNewImages(){
  for(const oldPath of Object.keys(newImages)){
    const base=oldPath.replace(/^images\//,"").replace(/\.[a-z0-9]+$/i,"");
    const res=await fetch("/api/image",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({dataURL:newImages[oldPath],baseName:base})});
    if(res.status===401)throw new Error("auth");
    const j=await res.json().catch(()=>({}));
    if(!res.ok||!j.path)throw new Error(j.error||"image upload failed");
    if(ART.portrait===oldPath)ART.portrait=j.path;
    ART.works.forEach(w=>{if(w.src===oldPath)w.src=j.path;});
    delete newImages[oldPath];
  }
}
async function doSave(){
  if(saving)return;saving=true;setStatus("Saving…");
  try{
    await uploadNewImages();
    const res=await fetch("/api/artist-content",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({artist:ART})});
    if(res.status===401)throw new Error("auth");
    const j=await res.json().catch(()=>({}));
    if(!res.ok||!j.ok)throw new Error(j.error||"save failed");
    setStatus("Saved — your page is live ✓",true);
  }catch(e){
    if(String(e.message)==="auth"){showGate("Session ended","Please open your editing link again to keep editing.");}
    else{setStatus("Save failed");alert("Could not save: "+e.message+"\n\nYour changes are still on screen — try again in a moment.");}
  }finally{saving=false;}
}

/* gate + boot */
function showGate(title,msg){document.getElementById("app").classList.add("hide");const g=document.getElementById("gate");g.classList.remove("hide");document.getElementById("gate-title").textContent=title;document.getElementById("gate-msg").textContent=msg;}
function showApp(){document.getElementById("gate").classList.add("hide");document.getElementById("app").classList.remove("hide");}
async function loadArtist(){
  const res=await fetch("/api/artist-content");
  if(res.status===401){showGate("Please use your link","Open the editing link the gallery sent you to edit your page.");return;}
  const j=await res.json().catch(()=>({}));
  if(!res.ok||!j.artist){showGate("Page not found",j.error||"We couldn't find your page. Please contact the gallery.");return;}
  ART=j.artist; if(!Array.isArray(ART.works))ART.works=[];
  showApp();render();setStatus("");
}
async function boot(){
  const hash=(location.hash||"").replace(/^#/,"").trim();
  if(hash){
    try{
      const r=await fetch("/api/artist-login",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({token:hash})});
      history.replaceState(null,"",location.pathname); // hide the token from the address bar
      if(!r.ok){showGate("Link not valid","This editing link isn't valid or has been replaced. Please ask the gallery for a new one.");return;}
    }catch(e){showGate("Connection problem","Please check your internet and try the link again.");return;}
  }
  await loadArtist();
}
document.getElementById("btnSaveTop").addEventListener("click",doSave);
document.getElementById("btnSaveBottom").addEventListener("click",doSave);
boot();
</script>
</body>
</html>
