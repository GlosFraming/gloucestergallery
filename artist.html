<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Artist — Gloucester Gallery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,ital,wght@9..144,0,300;9..144,0,400;9..144,1,300;9..144,1,400&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
/* ── ARTIST HERO ── */
.artist-hero {
  background: var(--ink); color: var(--paper);
  padding: 5rem 2rem 4.5rem; position: relative; overflow: hidden;
}
.artist-hero::before {
  content: ""; position: absolute; inset: 0;
  background: radial-gradient(ellipse at 75% 40%, rgba(184,147,90,.16) 0%, transparent 55%);
}
.artist-hero-inner {
  max-width: 1340px; margin: 0 auto; position: relative; z-index: 2;
  display: grid; grid-template-columns: auto 1fr; gap: 3.5rem; align-items: start;
}
.back-link {
  display: inline-flex; align-items: center; gap: .5rem;
  font-size: .76rem; letter-spacing: .12em; text-transform: uppercase;
  color: var(--gold); margin-bottom: 2.5rem; transition: gap .2s;
}
.back-link:hover { gap: .8rem; }
.ap-portrait-wrap {
  width: 180px; height: 180px; border-radius: 50%;
  border: 3px solid rgba(184,147,90,.5); overflow: hidden;
  background: var(--ink-soft); flex-shrink: 0;
}
.ap-portrait-wrap img { width: 100%; height: 100%; object-fit: cover; }
.ap-portrait-wrap .initials {
  width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
  font-family: var(--D); font-size: 3.5rem; font-weight: 300; color: var(--gold);
}
.ap-info .status-pill {
  display: inline-block; font-size: .67rem; letter-spacing: .18em; text-transform: uppercase;
  font-weight: 700; padding: .3rem .75rem; border-radius: 1px; margin-bottom: 1rem;
}
.status-pill.current  { background: var(--gold); color: var(--ink); }
.status-pill.upcoming { background: var(--red); color: #fff; }
.status-pill.past     { background: rgba(255,255,255,.1); color: rgba(246,241,236,.6); }
.ap-info .disc { font-size: .74rem; letter-spacing: .2em; text-transform: uppercase; color: var(--gold); margin-bottom: .5rem; }
.ap-info h1 { font-family: var(--D); font-weight: 300; font-size: clamp(2.2rem,4.5vw,3.8rem); line-height: 1; margin-bottom: .5rem; }
.ap-info .tagline { font-style: italic; color: rgba(246,241,236,.6); font-size: 1.1rem; margin-bottom: 1.2rem; font-family: var(--D); }
.ap-info .bio { color: rgba(246,241,236,.75); max-width: 60ch; line-height: 1.75; margin-bottom: 1.5rem; }
.ap-meta-row { display: flex; gap: 2rem; flex-wrap: wrap; }
.ap-meta-item { font-size: .8rem; color: rgba(246,241,236,.5); }
.ap-meta-item strong { display: block; color: var(--paper); font-weight: 500; margin-bottom: .1rem; }

/* ── LAUNCH CALLOUT ── */
.launch-callout {
  background: rgba(193,39,45,.12); border-left: 3px solid var(--red);
  padding: 1rem 1.4rem; border-radius: 0 2px 2px 0;
  display: flex; gap: 1rem; align-items: flex-start; margin-top: 1.5rem;
  max-width: 500px;
}
.launch-callout .lc-text strong { display: block; color: var(--paper); font-size: .9rem; margin-bottom: .2rem; }
.launch-callout .lc-text span { font-size: .84rem; color: rgba(246,241,236,.65); }

/* ── WORKS SECTION ── */
.works-section { background: var(--paper-warm); }
.works-filters { display: flex; gap: .5rem; margin-bottom: 2.5rem; flex-wrap: wrap; }
.works-filter-btn {
  background: none; border: 1px solid rgba(26,20,22,.15); color: var(--ink-soft);
  padding: .4rem .9rem; border-radius: 2px; font-size: .74rem; letter-spacing: .1em;
  text-transform: uppercase; font-weight: 500; transition: all .2s; cursor: pointer;
}
.works-filter-btn.active { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.works-filter-btn:hover:not(.active) { border-color: var(--gold); color: var(--gold); }

.works-grid {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 2rem;
}
.work-card {
  background: var(--cream); border-radius: 3px; overflow: hidden;
  border: 1px solid rgba(26,20,22,.07);
  transition: transform .4s var(--ease), box-shadow .4s;
}
.work-card:hover { transform: translateY(-6px); box-shadow: var(--shadow-lg); }
.work-img {
  aspect-ratio: 4/3; position: relative; overflow: hidden;
  background: linear-gradient(135deg, var(--ink-soft), var(--red-deep));
  cursor: zoom-in;
}
.work-img img { width: 100%; height: 100%; object-fit: cover; transition: transform .5s var(--ease); }
.work-card:hover .work-img img { transform: scale(1.04); }
.work-img .no-img { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-family: var(--D); font-style: italic; color: rgba(246,241,236,.3); font-size: .9rem; }
.sold-tag { position: absolute; top: .85rem; left: .85rem; background: var(--ink); color: var(--paper); font-size: .62rem; letter-spacing: .14em; text-transform: uppercase; font-weight: 600; padding: .28rem .6rem; border-radius: 1px; }
.work-body { padding: 1.3rem 1.5rem 1.6rem; }
.work-body h4 { font-family: var(--D); font-size: 1.05rem; font-weight: 400; margin-bottom: .25rem; }
.work-meta { font-size: .8rem; color: var(--ink-soft); margin-bottom: .15rem; }
.work-size { font-size: .76rem; color: rgba(26,20,22,.45); margin-bottom: 1rem; }
.work-footer { display: flex; align-items: center; justify-content: space-between; padding-top: .9rem; border-top: 1px solid rgba(26,20,22,.07); }
.work-price { font-family: var(--D); font-size: 1.35rem; font-weight: 400; }
.work-price.sold { color: rgba(26,20,22,.3); text-decoration: line-through; font-size: 1rem; }
.work-sold-label { font-size: .76rem; color: rgba(26,20,22,.35); letter-spacing: .1em; text-transform: uppercase; }

/* ── IMAGE LIGHTBOX ── */
.lightbox { display: none; position: fixed; inset: 0; background: rgba(26,20,22,.96); z-index: 600; align-items: center; justify-content: center; padding: 2rem; cursor: zoom-out; }
.lightbox.open { display: flex; }
.lightbox img { max-height: 90vh; max-width: 90vw; object-fit: contain; border-radius: 2px; box-shadow: 0 40px 80px rgba(0,0,0,.5); }
.lightbox-close { position: absolute; top: 1.5rem; right: 1.5rem; background: rgba(255,255,255,.1); color: var(--paper); border: none; width: 36px; height: 36px; border-radius: 50%; font-size: 1rem; display: flex; align-items: center; justify-content: center; transition: background .2s; }
.lightbox-close:hover { background: var(--red); }

/* ── MODAL ── */
.modal-img { aspect-ratio: 4/3; overflow: hidden; }
.modal-img img { width: 100%; height: 100%; object-fit: cover; }
.modal-body { padding: 1.8rem 2rem 2.2rem; }
.modal-body h3 { font-family: var(--D); font-size: 1.4rem; font-weight: 400; margin-bottom: .3rem; }
.modal-meta { font-size: .85rem; color: var(--ink-soft); margin-bottom: .15rem; }
.modal-size { font-size: .78rem; color: rgba(26,20,22,.4); margin-bottom: 1.2rem; }
.modal-price-row { display: flex; align-items: center; gap: 1rem; margin-bottom: 1rem; }
.modal-price { font-family: var(--D); font-size: 1.9rem; font-weight: 300; }
.test-badge { background: var(--red); color: #fff; font-size: .62rem; letter-spacing: .1em; text-transform: uppercase; font-weight: 700; padding: .2rem .55rem; border-radius: 1px; }
.modal-note { font-size: .82rem; color: var(--ink-soft); background: var(--paper-warm); padding: .9rem 1rem; border-radius: 2px; border-left: 3px solid var(--gold); line-height: 1.6; margin-bottom: 1.3rem; }
#card-element { background: rgba(26,20,22,.05); border: 1px solid rgba(26,20,22,.15); border-radius: 2px; padding: .8rem 1rem; margin-top: .4rem; }
#card-errors { color: var(--red); font-size: .84rem; margin: .4rem 0; }
#payment-success { display: none; text-align: center; padding: 2.5rem 2rem; }
#payment-success .tick { font-size: 2.8rem; margin-bottom: .8rem; }
#payment-success h4 { font-family: var(--D); font-size: 1.4rem; font-weight: 300; margin-bottom: .6rem; }
#payment-success p { color: var(--ink-soft); font-size: .9rem; line-height: 1.65; }

/* ── NOT FOUND ── */
.not-found { min-height: 50vh; display: flex; align-items: center; justify-content: center; text-align: center; padding: 4rem 2rem; }
.not-found h2 { font-family: var(--D); font-weight: 300; font-size: 2.5rem; color: rgba(26,20,22,.25); margin-bottom: 1rem; }

@media (max-width: 1024px) { .works-grid { grid-template-columns: repeat(2,1fr); } }
@media (max-width: 768px) {
  .artist-hero-inner { grid-template-columns: 1fr; }
  .ap-portrait-wrap { margin: 0 auto; }
  .works-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div id="promo"></div>
<div class="topbar">
  <div class="wrap">
    <span id="topbar-address"></span>
    <div class="tb-links" id="topbar-links"></div>
  </div>
</div>
<header id="main-header">
  <nav class="nav">
    <div id="nav-logo"></div>
    <div class="nav-links" id="nav-links"></div>
    <div class="nav-actions">
      <a href="gallery.html" class="nav-cta-gold">Buy Work</a>
      <a href="index.html#rent" class="nav-cta-ink">Show Here</a>
    </div>
    <button class="menu-btn" id="menu-btn" aria-label="Menu"><span></span><span></span><span></span></button>
  </nav>
</header>

<!-- Dynamic content inserted here -->
<div id="page-content"></div>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lightbox-close">✕</button>
  <img id="lightbox-img" src="" alt="">
</div>

<!-- PURCHASE MODAL -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <button class="modal-close" id="modal-close">✕</button>
    <div class="modal-img" id="modal-img"></div>
    <div class="modal-body">
      <h3 id="modal-title"></h3>
      <div class="modal-meta" id="modal-meta"></div>
      <div class="modal-size" id="modal-size"></div>
      <div class="modal-price-row">
        <div class="modal-price" id="modal-price"></div>
        <span id="modal-test-badge"></span>
      </div>
      <div class="modal-note" id="modal-note"></div>
      <div id="payment-form-wrap">
        <div class="fgroup light"><label>Your name</label><input type="text" id="buyer-name" placeholder="Full name"></div>
        <div class="fgroup light"><label>Email</label><input type="email" id="buyer-email" placeholder="you@example.com"></div>
        <div class="fgroup light"><label>Card details</label><div id="card-element"></div></div>
        <div id="card-errors"></div>
        <button class="btn btn-gold" id="pay-btn" style="width:100%;justify-content:center;margin-top:1rem">
          <span id="pay-btn-text">Pay now</span>
        </button>
      </div>
      <div id="payment-success">
        <div class="tick">✦</div>
        <h4>Purchase confirmed</h4>
        <p id="success-msg"></p>
      </div>
    </div>
  </div>
</div>

<footer>
  <div class="foot-grid container">
    <div class="foot-brand">
      <div id="foot-logo"></div>
      <p>A new local artist every month. Original works for sale. Free entry, always.</p>
    </div>
    <div class="foot-col">
      <h5>Explore</h5>
      <a href="index.html">Home</a>
      <a href="gallery.html">Buy work</a>
      <a href="index.html#rent">Show your work</a>
      <a href="index.html#hours">Visit</a>
    </div>
    <div class="foot-col">
      <h5>Find us</h5>
      <p id="foot-address"></p>
      <a id="foot-directions" target="_blank" rel="noopener" style="color:var(--gold);font-weight:600">→ Get directions</a>
      <a id="foot-phone"></a>
      <a id="foot-email"></a>
    </div>
  </div>
  <div class="foot-bottom container">
    <span id="foot-copy"></span>
    <div class="socials" id="foot-socials"></div>
  </div>
</footer>

<script src="content.js"></script>
<script src="shared.js"></script>
<script>
(function () {
  const G = window.GALLERY;
  if (!G) { console.error('content.js not loaded'); return; }
  renderHeader('artists');
  initReveal();

  const params = new URLSearchParams(location.search);
  const artistId = params.get('id');
  const artist = artistId ? G.artists.find(a => a.id === artistId) : null;

  const content = document.getElementById('page-content');

  if (!artist) {
    content.innerHTML = `
      <div class="not-found container">
        <div><h2>Artist not found</h2><p><a href="gallery.html" class="btn btn-ink">← Back to gallery</a></p></div>
      </div>`;
    return;
  }

  // Update page title
  document.title = `${artist.name} — Gloucester Gallery`;

  const initials = artist.name.split(' ').map(w => w[0]).join('');
  const portraitHtml = artist.portrait
    ? `<img src="${artist.portrait}" alt="${artist.name}" onerror="this.parentNode.innerHTML='<div class=initials>${initials}</div>'">`
    : `<div class="initials">${initials}</div>`;

  const availCount = (artist.works || []).filter(w => w.available).length;

  content.innerHTML = `
    <div class="artist-hero">
      <div class="artist-hero-inner container">
        <div>
          <a href="gallery.html" class="back-link">← All artists</a>
          <div class="ap-portrait-wrap">${portraitHtml}</div>
        </div>
        <div class="ap-info">
          <span class="status-pill ${artist.status}">${artist.status === 'current' ? 'Now Showing' : artist.status === 'upcoming' ? 'Coming Soon' : 'Past Exhibition'}</span>
          <div class="disc">${artist.discipline} · ${artist.month}</div>
          <h1>${artist.name}</h1>
          <div class="tagline">${artist.tagline}</div>
          <p class="bio">${artist.bio}</p>
          <div class="ap-meta-row">
            <div class="ap-meta-item"><strong>${(artist.works||[]).length}</strong>Works in collection</div>
            <div class="ap-meta-item"><strong>${availCount}</strong>Available to buy</div>
          </div>
          ${artist.launchDate ? `
          <div class="launch-callout">
            <svg viewBox="0 0 24 24" width="18" height="18" stroke="var(--red)" stroke-width="1.8" fill="none" style="flex-shrink:0;margin-top:.15rem"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
            <div class="lc-text"><strong>Launch event: ${artist.launchDate}</strong><span>${artist.launchNote}</span></div>
          </div>` : ''}
        </div>
      </div>
    </div>

    <section class="works-section">
      <div class="container">
        <div class="section-head">
          <span class="kicker">Works for sale</span>
          <h2>${artist.name}'s collection</h2>
        </div>
        <div class="works-filters" id="works-filters">
          <button class="works-filter-btn active" data-wf="all">All works (${(artist.works||[]).length})</button>
          <button class="works-filter-btn" data-wf="available">Available (${availCount})</button>
          <button class="works-filter-btn" data-wf="sold">Sold</button>
        </div>
        <div class="works-grid" id="works-grid"></div>
      </div>
    </section>`;

  // ── Render works ──────────────────────────────────────────
  function renderWorks(filter) {
    const grid = document.getElementById('works-grid');
    let works = artist.works || [];
    if (filter === 'available') works = works.filter(w => w.available);
    if (filter === 'sold') works = works.filter(w => !w.available);
    grid.innerHTML = '';
    if (!works.length) {
      grid.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:3rem;color:rgba(26,20,22,.4);font-style:italic;font-family:var(--D)">No works to show.</div>`;
      return;
    }
    works.forEach(w => {
      const imgHtml = w.src
        ? `<img src="${w.src}" alt="${w.title}" onclick="openLightbox('${w.src}')" onerror="this.parentNode.innerHTML='<div class=no-img>${w.title}</div>'">`
        : `<div class="no-img">${w.title}</div>`;
      const card = document.createElement('div');
      card.className = 'work-card reveal';
      card.innerHTML = `
        <div class="work-img">
          ${!w.available ? '<span class="sold-tag">Sold</span>' : ''}
          ${imgHtml}
        </div>
        <div class="work-body">
          <h4>${w.title}</h4>
          <div class="work-meta">${w.medium}</div>
          <div class="work-size">${w.size}</div>
          <div class="work-footer">
            <div class="work-price${w.available ? '' : ' sold'}">£${w.price}</div>
            ${w.available
              ? `<button class="btn btn-ink" style="padding:.55rem 1rem;font-size:.74rem" onclick="openPurchase('${artist.id}','${w.title.replace(/'/g,"\\'")}')">Buy</button>`
              : `<span class="work-sold-label">Sold</span>`}
          </div>
        </div>`;
      grid.appendChild(card);
    });
    initReveal();
  }

  renderWorks('all');

  document.getElementById('works-filters').addEventListener('click', e => {
    const btn = e.target.closest('[data-wf]');
    if (!btn) return;
    document.querySelectorAll('.works-filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderWorks(btn.dataset.wf);
  });

  // ── Lightbox ──────────────────────────────────────────────
  window.openLightbox = function (src) {
    document.getElementById('lightbox-img').src = src;
    document.getElementById('lightbox').classList.add('open');
    document.body.style.overflow = 'hidden';
  };
  document.getElementById('lightbox').addEventListener('click', () => closeLightbox());
  document.getElementById('lightbox-close').addEventListener('click', e => { e.stopPropagation(); closeLightbox(); });
  function closeLightbox() {
    document.getElementById('lightbox').classList.remove('open');
    document.body.style.overflow = '';
  }

  // ── Purchase modal ────────────────────────────────────────
  let currentWork = null, stripeInst = null, cardEl = null;

  window.openPurchase = function (artistId, workTitle) {
    const a = G.artists.find(x => x.id === artistId);
    const w = (a?.works || []).find(x => x.title === workTitle);
    if (!w || !w.available) return;
    currentWork = { artist: a, work: w };

    document.getElementById('payment-form-wrap').style.display = 'block';
    document.getElementById('payment-success').style.display = 'none';
    document.getElementById('buyer-name').value = '';
    document.getElementById('buyer-email').value = '';
    document.getElementById('card-errors').textContent = '';
    document.getElementById('modal-title').textContent = w.title;
    document.getElementById('modal-meta').textContent = `${w.medium} · ${a.name}`;
    document.getElementById('modal-size').textContent = w.size;
    document.getElementById('modal-price').textContent = `£${w.price}`;
    document.getElementById('modal-note').textContent = G.stripe.collectNote;
    document.getElementById('pay-btn-text').textContent = `Pay now — £${w.price}`;
    document.getElementById('modal-test-badge').innerHTML = G.stripe.testMode ? '<span class="test-badge">Test mode</span>' : '';
    document.getElementById('modal-img').innerHTML = w.src ? `<img src="${w.src}" alt="${w.title}">` : '';
    document.getElementById('modal-overlay').classList.add('open');
    document.body.style.overflow = 'hidden';

    if (!window.Stripe) {
      const s = document.createElement('script'); s.src = 'https://js.stripe.com/v3/'; s.onload = mountCard; document.head.appendChild(s);
    } else mountCard();
  };

  function mountCard() {
    try {
      stripeInst = Stripe(G.stripe.publishableKey);
      const elements = stripeInst.elements();
      if (cardEl) { try { cardEl.destroy(); } catch(e){} }
      cardEl = elements.create('card', { style: { base: { fontFamily: '"Outfit",sans-serif', fontSize: '16px', color: '#1a1416' } }, hidePostalCode: true });
      cardEl.mount('#card-element');
      cardEl.on('change', e => { document.getElementById('card-errors').textContent = e.error?.message || ''; });
    } catch(e) {
      document.getElementById('card-element').innerHTML = '<small style="color:rgba(26,20,22,.5)">Add your Stripe key to activate payments</small>';
    }
  }

  document.getElementById('modal-close').addEventListener('click', closeModal);
  document.getElementById('modal-overlay').addEventListener('click', e => { if (e.target.id === 'modal-overlay') closeModal(); });
  function closeModal() {
    document.getElementById('modal-overlay').classList.remove('open');
    document.body.style.overflow = '';
    if (cardEl) { try { cardEl.unmount(); } catch(e){} cardEl = null; }
  }

  document.getElementById('pay-btn').addEventListener('click', () => {
    if (!currentWork) return;
    const name = document.getElementById('buyer-name').value.trim();
    const email = document.getElementById('buyer-email').value.trim();
    if (!name || !email) { document.getElementById('card-errors').textContent = 'Please enter your name and email.'; return; }
    document.getElementById('pay-btn').disabled = true;
    document.getElementById('pay-btn-text').textContent = 'Processing…';
    setTimeout(() => {
      document.getElementById('payment-form-wrap').style.display = 'none';
      document.getElementById('payment-success').style.display = 'block';
      document.getElementById('success-msg').textContent = `Thank you, ${name.split(' ')[0]}. A confirmation has been sent to ${email}. ${G.stripe.collectNote}`;
      currentWork.work.available = false;
      renderWorks('all');
    }, G.stripe.testMode ? 1600 : 0);
  });

})();
</script>
</body>
</html>
